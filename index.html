<html lang="en">

<title>Vishnu Trivedi | Pharmacist</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f5fbf9;
  color:#1f2937;
  line-height:1.6;
}

header{
  background:linear-gradient(135deg,#087f5b,#12b886);
  color:white;
  text-align:center;
  padding:70px 20px;
}

header h1{
  font-size:42px;
  margin-bottom:10px;
}

header p{
  font-size:19px;
}

nav{
  background:white;
  padding:16px 10px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
}

nav a{
  color:#087f5b;
  text-decoration:none;
  font-weight:bold;
  margin:0 10px;
}

section{
  max-width:1050px;
  margin:auto;
  padding:60px 20px;
}

h2{
  text-align:center;
  color:#087f5b;
  font-size:32px;
  margin-bottom:30px;
}

.hero-box,.about-box{
  background:white;
  border-radius:20px;
  padding:35px;
  text-align:center;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.hero-box h2{
  margin-bottom:15px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}

.card{
  background:white;
  padding:30px 22px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 7px 22px rgba(0,0,0,.08);
}

.card h3{
  color:#087f5b;
  margin-bottom:12px;
}

.icon{
  font-size:42px;
  margin-bottom:12px;
}

.contact{
  background:linear-gradient(135deg,#087f5b,#12b886);
  color:white;
  text-align:center;
  border-radius:20px;
  padding:45px 20px;
}

.contact h2{
  color:white;
}

.button{
  display:inline-block;
  margin-top:20px;
  padding:13px 25px;
  background:white;
  color:#087f5b;
  text-decoration:none;
  border-radius:30px;
  font-weight:bold;
}

footer{
  background:#063b2a;
  color:white;
  text-align:center;
  padding:22px;
}
